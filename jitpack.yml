# jitpack.yml
# Uses JDK 17 and injects a Gradle init script that disables all GPG signing tasks

jdk:
  - openjdk17

before_install:
  - |
    cat << 'EOF' > /tmp/disable-signing.gradle
    allprojects {
      tasks.withType(org.gradle.plugins.signing.Sign).configureEach {
        enabled = false
      }
    }
    EOF

install:
  - ./gradlew publishToMavenLocal --init-script /tmp/disable-signing.gradle